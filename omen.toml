# Omen is used here as a developer-only codebase health tool. It is not part of
# the thesis case pipeline and must not inspect private case workspaces.

exclude_patterns = [
  ".git/**",
  ".mypy_cache/**",
  ".omen/**",
  ".pants.d/**",
  ".pytest_cache/**",
  ".venv/**",
  "**/__pycache__/**",
  "cases/**",
  "dist/**",
  "env/**",
  "venv/**",
]

[complexity]
cyclomatic_warn = 10
cyclomatic_error = 20
cognitive_warn = 15
cognitive_error = 30
max_nesting = 4

[satd]
categories = ["design", "defect", "requirement", "test", "performance", "security"]
custom_markers = []

[churn]
since = "6m"
top = 20

[duplicates]
min_tokens = 100
min_similarity = 0.9

[hotspot]
top = 20

[score.thresholds]
complexity = 85.0
duplication = 65.0
satd = 80.0
tdg = 90.0
coupling = 70.0
smells = 90.0
cohesion = 80.0

[feature_flags]
stale_days = 90
providers = []
custom_providers = []
